# XcodeGen spec. Run `xcodegen generate` after adding or removing files, then open
# Heyday.xcodeproj. The generated project is not checked in. It has two apps built
# from the one `App` folder: Heyday for the Mac, and Heyday-iOS for iPhone and iPad.
name: Heyday

options:
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  HeydayKit:
    path: .

targets:
  Heyday:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: HeydayKit
        product: HeydayKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.heyday.mac
        PRODUCT_NAME: Heyday
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_CFBundleDisplayName: Heyday
        # Made by Tools/make-icon.swift.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Signed ad hoc, to run on the Mac that built it. Not sandboxed: it connects
        # to mail servers and saves attachments to Downloads, both of which a
        # sandboxed build would need entitlements for.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO

  # The same app for iPhone and iPad, from the same sources: what differs between
  # the platforms is marked in the code with `#if os(macOS)`.
  Heyday-iOS:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: App
    dependencies:
      - package: HeydayKit
        product: HeydayKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.heyday.Heyday
        PRODUCT_NAME: Heyday
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Heyday
        # Made by Tools/make-icon.swift.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # Asked when the mail server is on the same network as the device.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Heyday connects to your mail server when it is on this network.
        # A device build is signed by a team: `DEVELOPMENT_TEAM=<team id> xcodegen generate`.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}

schemes:
  Heyday:
    build:
      targets:
        Heyday: all
    run:
      config: Debug
    test:
      config: Debug
  Heyday-iOS:
    build:
      targets:
        Heyday-iOS: all
    run:
      config: Debug
